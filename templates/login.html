{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish - Bookify</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #10b981;
            --accent-dark: #059669;
            --ink: #0f172a;
            --muted: #64748b;
        }

        * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.18), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(59, 130, 246, 0.15), transparent 45%),
                linear-gradient(160deg, #0b1220 0%, #111827 50%, #0b1220 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .brand-header .icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
            margin-bottom: 0.75rem;
        }

        .brand-header h1 {
            color: #fff;
            font-weight: 800;
            font-size: 1.6rem;
            margin: 0;
        }

        .brand-header p {
            color: #94a3b8;
            font-size: 0.88rem;
            margin-top: 0.25rem;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            padding: 2.25rem 2rem;
        }

        .field-group {
            margin-bottom: 1.25rem;
        }

        .field-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--ink);
            margin-bottom: 0.4rem;
            display: block;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a3aebc;
            font-size: 1rem;
        }

        .toggle-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a3aebc;
            font-size: 1rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .input-icon-wrap input {
            width: 100%;
            padding: 0.75rem 2.6rem 0.75rem 2.6rem;
            border: 1.5px solid #e5e9f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            background: #f8fafc;
        }

        .input-icon-wrap input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 0.85rem 1rem;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 10px 24px rgba(16, 185, 129, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(16, 185, 129, 0.4);
            color: #fff;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
        }

        .back-link:hover {
            color: #fff;
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand-header">
            <div class="icon-circle"><i class="bi bi-book-half"></i></div>
            <h1>Tizimga kirish</h1>
            <p>Bookify admin paneliga xush kelibsiz</p>
        </div>

        <div class="login-card">
            {% if form.errors %}
            <div class="error-box">
                <i class="bi bi-exclamation-circle"></i>
                Login yoki parol noto'g'ri kiritildi.
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="field-group">
                    <label for="id_username">Foydalanuvchi nomi</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person"></i>
                        <input type="text" name="username" id="id_username" placeholder="Login" required autofocus>
                    </div>
                </div>

                <div class="field-group">
                    <label for="id_password">Parol</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-lock"></i>
                        <input type="password" name="password" id="id_password" placeholder="••••••••" required>
                        <button type="button" class="toggle-eye" onclick="togglePassword()">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Kirish
                </button>
            </form>
        </div>

        <a href="/books/" class="back-link">
            <i class="bi bi-arrow-left"></i> Kitoblar katalogiga qaytish
        </a>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('id_password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>
</html>
