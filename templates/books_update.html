{% extends 'base_admin.html' %}

{% block title %}{{ book.title }} - Tahrirlash{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <a href="{% url 'books_list' %}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Kitoblar ro'yxatiga</a>
        <h3 class="fw-bold mb-0 mt-1">Kitobni tahrirlash</h3>
    </div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="dashboard-card">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nomi</label>
                    <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Muallif</label>
                        <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Janr</label>
                        <input type="text" name="genre" class="form-control" value="{{ book.genre }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Narxi</label>
                    <input type="number" step="0.01" name="price" class="form-control" value="{{ book.price }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tavsif</label>
                    <textarea name="description" class="form-control" rows="4" required>{{ book.description }}</textarea>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nashr etilgan sana</label>
                        <input type="date" name="published_date" class="form-control" value="{{ book.published_date|date:'Y-m-d' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Sahifalar soni</label>
                        <input type="number" name="pages_count" class="form-control" value="{{ book.pages_count }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Kitob muqovasi (Rasm)</label>
                    {% if book.image %}
                        <div class="mb-2">
                            <img src="{{ book.image.url }}" style="width: 80px; height: 80px; object-fit: cover;" class="rounded">
                        </div>
                    {% endif %}
                    <input type="file" name="image" class="form-control" accept="image/*">
                    <div class="form-text">Bo'sh qoldirsangiz, joriy rasm o'zgarmaydi.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Kitob matni (ixtiyoriy)</label>
                    <textarea name="content" class="form-control" rows="8">{{ book.content }}</textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-check-lg"></i> Yangilash
                    </button>
                    <a href="{% url 'books_list' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Bekor qilish
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
